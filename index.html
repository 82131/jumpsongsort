<style>
    /* メンカラ着せ替え用の変数（初期値はパステルグレー） */
    :root {
        --theme-color: #bdbdbd;
        --theme-light: #f5f5f5;
    }

    /* 全体のスタイル */
    body {
        font-family: 'メイリオ', sans-serif;
        text-align: center;
        color: #333;
        background-color: #fafafa;
        margin: 0;
        padding: 20px;
    }
    .container {
        max-width: 650px;
        margin: 0 auto;
        background: #fff;
        padding: 20px 20px 40px 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.05);
        position: relative;
        overflow: hidden;
    }

    /* メンバーカラーのパステルグラデーションバー */
    .member-colors-bar {
        height: 10px;
        background: linear-gradient(to right, #e57373, #f06292, #ffb74d, #ffd54f, #81c784, #64b5f6, #ba68c8, #eeeeee);
        margin: -20px -20px 20px -20px;
    }
    
    /* 各ステップの表示切り替え用 */
    .step-section { display: none; }
    .step-section.active { display: block; }
    
    h2 { font-size: 18px; color: var(--theme-color); border-bottom: 2px solid var(--theme-color); padding-bottom: 5px; margin-bottom: 15px; }
    
    /* ボタンのスタイル（メンカラ連動） */
    .btn {
        padding: 10px 20px; font-size: 16px; font-weight: bold;
        background-color: var(--theme-color); color: #fff; border: none;
        border-radius: 5px; cursor: pointer; margin-top: 15px; transition: 0.2s;
    }
    .btn:hover { opacity: 0.8; }
    
    .btn-share { background-color: #81D4FA; margin-right: 10px; color: #333;}
    .btn-save { background-color: #FFCC80; margin-right: 10px; color: #333;}
    .btn-gray { background-color: #e0e0e0; color: #555; }

    /* 担当選択ボタンのグリッド */
    .oshi-grid {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px;
    }
    @media (min-width: 500px) { .oshi-grid { grid-template-columns: repeat(4, 1fr); } }
    
    .oshi-btn {
        padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px;
        cursor: pointer; color: #333; border: 2px solid transparent; transition: 0.2s;
    }
    .oshi-btn:hover { filter: brightness(0.95); transform: translateY(-2px); }

    /* リスト選択のスタイル */
    #series-checkboxes { text-align: left; padding: 10px 0; }
    .category-group { margin-bottom: 15px; border: 2px solid var(--theme-light); border-radius: 8px; padding: 15px; background: #fff; }
    .category-title { font-weight: bold; color: var(--theme-color); margin-bottom: 12px; border-bottom: 2px dotted var(--theme-color); padding-bottom: 5px; font-size: 15px; }
    .category-items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 14px; }
    @media (min-width: 500px) { .category-items { grid-template-columns: repeat(3, 1fr); } }
    .category-items label { cursor: pointer; color: #555; }

    /* 予選用スタイル */
    #prelim-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
    .prelim-item {
        border: 2px solid #eee; padding: 15px 10px; border-radius: 8px;
        cursor: pointer; transition: 0.2s; background-color: #fff;
        display: flex; align-items: center; justify-content: center; min-height: 50px; font-size: 14px; color: #555;
    }
    /* 選択された時の枠線と背景をメンカラにする */
    .prelim-item.selected {
        border-color: var(--theme-color); background-color: var(--theme-light); font-weight: bold; color: #333;
    }
    
    /* 進捗カウンター */
    .counter-box { background-color: var(--theme-light); color: #333; padding: 10px; border-radius: 5px; font-weight: bold; margin: 10px 0; display: inline-block; font-size: 14px; border: 1px solid var(--theme-color); }

    /* 本戦用スタイル */
    #mainTable { width: 100%; max-width: 500px; margin: 20px auto; border-collapse: separate; border-spacing: 5px; }
    .battle-btn { border: 2px solid var(--theme-color); padding: 20px; cursor: pointer; width: 40%; background: #fff; border-radius: 8px; min-height: 80px; font-weight:bold; color:#444; transition: 0.2s; }
    .battle-btn:hover { background: var(--theme-light); }
    .middle-btn { border: 1px solid #ddd; padding: 10px; cursor: pointer; width: 20%; background: #f9f9f9; font-size: 12px; border-radius: 5px; color:#666; }

    /* 結果テーブル（メンカラ連動） */
    #capture-area { background: #fff; padding: 20px; margin-bottom: 20px; }
    .result-table { width: 90%; margin: 0 auto; border-collapse: collapse; font-size: 14px; }
    .result-table th, .result-table td { border: 1px solid var(--theme-color); padding: 8px; color: #444; }
    .result-table th { background-color: var(--theme-light); color: var(--theme-color); }
</style>
</head>

<div class="container">

    <!-- ==================== ①リスト選択ステップ ==================== -->

        <button class="btn" onclick="startPreliminary()">予選スタート！</button>
    </div>

 <!-- ==================== ②予選ステップ ==================== -->

        <button class="btn btn-gray" onclick="prevPrelim()">＜ 一つ戻る</button>
        <button class="btn" onclick="nextPrelim()">次へ ＞</button>
    </div>

    <!-- ==================== ③本戦ステップ ==================== -->
    <div id="step-main" class="step-section">
        <h2>③本戦：より好きな方を選んでください</h2>
        <div id="battleNumber" style="font-size: 14px; color: #888; margin-bottom: 10px;"></div>
        <table id="mainTable">

                <td id="rightField" class="battle-btn" onclick="if(finishFlag==0)sortList(1);"></td>
            </tr>
        </table>
        <button class="btn btn-gray" style="margin-top:20px;" onclick="undoSort()">＜ 一つ戻る</button>
    </div>
    <!-- ==================== ④結果ステップ ==================== -->
    <div id="step-result" class="step-section">
        <div id="capture-area">

        </div>

</div>

// ==========================================
// 初期化・予選の処理
// ==========================================
var candidateSongs = [], prelimBlocks = [], currentBlockIdx = 0;
var selectedInBlock = [], survivingSongs = [];
var blockSelections = []; // ★予選の戻る機能用
const MIN_REQUIRED_SONGS = 8;

window.onload = function() {
    var cbHTML = "";
    for (var c = 0; c < seriesCategories.length; c++) {
        var cat = seriesCategories[c];
        cbHTML += `<div class="category-group"><div class="category-title">${cat.name}</div><div class="category-items">`;
        for (var i = 0; i < cat.ids.length; i++) {
            var idx = seriesList.indexOf(cat.ids[i]);
            if(idx !== -1) {
                var checked = ""; // ★自動チェックを解除
                cbHTML += `<label><input type="checkbox" name="s1" value="${seriesList[idx]}" ${checked}> ${seriesTitle[idx]}</label>`;
            }
        }
        cbHTML += `</div></div>`;
    }
    document.getElementById("series-checkboxes").innerHTML = cbHTML;
};

function showStep(stepId) {
    var steps = document.querySelectorAll('.step-section');
    steps.forEach(s => s.classList.remove('active'));
    document.getElementById(stepId).classList.add('active');
}

Array.prototype.shuffle = function() {
    for (let i = this.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [this[i], this[j]] = [this[j], this[i]]; } return this;
}

function startPreliminary() {
    var tempSongs = []; var checkboxes = document.getElementsByName("s1");
    for (var i = 0; i < checkboxes.length; i++) { if(checkboxes[i].checked && namMemberSeries[checkboxes[i].value]){ tempSongs = tempSongs.concat(namMemberSeries[checkboxes[i].value]); } }
    candidateSongs = Array.from(new Set(tempSongs));
    if(candidateSongs.length === 0) { alert("最低1つのリストを選択してください。"); return; }
    candidateSongs.shuffle(); prelimBlocks = []; survivingSongs = []; blockSelections = [];
    for(let i=0; i < candidateSongs.length; i+=8) { prelimBlocks.push(candidateSongs.slice(i, i+8)); }
    currentBlockIdx = 0; renderPrelimBlock(); showStep("step-preliminary");
}

function renderPrelimBlock() {
    if (!blockSelections[currentBlockIdx]) blockSelections[currentBlockIdx] = [];
    selectedInBlock = blockSelections[currentBlockIdx];
    var currentSongs = prelimBlocks[currentBlockIdx];
    for(let i=0; i<8; i++) {
        let el = document.getElementById("p-item-" + i);
        if (currentSongs[i]) { 
            el.innerHTML = currentSongs[i]; el.style.display = "flex"; 
            el.className = selectedInBlock.includes(i) ? "prelim-item selected" : "prelim-item";
        } else { el.style.display = "none"; }
    }
    updatePrelimCounter(); document.getElementById("prelim-progress").innerHTML = `予選グループ: ${currentBlockIdx + 1} / ${prelimBlocks.length}`;
}

function togglePrelim(index) {
    if (!prelimBlocks[currentBlockIdx][index]) return; 
    let el = document.getElementById("p-item-" + index); let idxPos = selectedInBlock.indexOf(index);
    if(idxPos !== -1) { selectedInBlock.splice(idxPos, 1); el.classList.remove("selected"); } 
    else { if(selectedInBlock.length >= 4) { alert("選べるのは4曲までです！"); return; } selectedInBlock.push(index); el.classList.add("selected"); }
    updatePrelimCounter();
}

function updatePrelimCounter() {
    let totalWillPass = 0;
    for(let i=0; i<blockSelections.length; i++) { totalWillPass += (blockSelections[i] ? blockSelections[i].length : 0); }
    document.getElementById("prelim-counter").innerText = `現在の通過予定: ${totalWillPass}曲 / 本戦へは最低 ${MIN_REQUIRED_SONGS}曲 必要`;
    if(totalWillPass < MIN_REQUIRED_SONGS) { document.getElementById("prelim-counter").style.color = "#d32f2f"; document.getElementById("prelim-counter").style.backgroundColor = "#ffebee"; } 
    else { document.getElementById("prelim-counter").style.color = "var(--theme-color)"; document.getElementById("prelim-counter").style.backgroundColor = "var(--theme-light)"; }
}

function nextPrelim() {
    currentBlockIdx++;
    if(currentBlockIdx < prelimBlocks.length) { renderPrelimBlock(); } 
    else { 
        survivingSongs = [];
        for(let b=0; b<prelimBlocks.length; b++) {
            let currentSongs = prelimBlocks[b];
            let selected = blockSelections[b] || [];
            for(let i=0; i<selected.length; i++) { survivingSongs.push(currentSongs[selected[i]]); }
        }
        if(survivingSongs.length < MIN_REQUIRED_SONGS) { alert(`最低曲数（${MIN_REQUIRED_SONGS}曲）に達しませんでした。（現在: ${survivingSongs.length}曲）`); showStep("step-setup"); } 
        else { startMainSort(); } 
    }
}

// ★一つ戻る機能（予選用）
function prevPrelim() {
    if (currentBlockIdx > 0) { currentBlockIdx--; renderPrelimBlock(); }
}
// ==========================================
// 本戦（マージソート）の処理
// ==========================================
var namMember = [], lstMember = [], parent = [], equal = [], rec = [];
var cmp1, cmp2, head1, head2, nrec, numQuestion, totalSize, finishSize, finishFlag;
var sortHistory = []; // ★本戦の戻る機能用

function startMainSort() {
    namMember = survivingSongs.slice(); namMember.shuffle();
    var n = 0, mid, i; lstMember = []; parent = []; equal = []; rec = []; lstMember[n] = []; sortHistory = [];
    for (i=0; i<namMember.length; i++) lstMember[n][i] = i; parent[n] = -1; totalSize = 0; n++;
    for (i=0; i<lstMember.length; i++) { if(lstMember[i].length>=2) { mid = Math.ceil(lstMember[i].length/2); lstMember[n] = lstMember[i].slice(0,mid); totalSize += lstMember[n].length; parent[n] = i; n++; lstMember[n] = lstMember[i].slice(mid,lstMember[i].length); totalSize += lstMember[n].length; parent[n] = i; n++; } }
    for (i=0; i<namMember.length; i++) rec[i] = 0; nrec = 0; for (i=0; i<=namMember.length; i++) equal[i] = -1;
    cmp1 = lstMember.length-2; cmp2 = lstMember.length-1; head1 = 0; head2 = 0; numQuestion = 1; finishSize = 0; finishFlag = 0;
    showStep("step-main"); showImage();
}

function sortList(flag){
    // ★ボタンを押した瞬間の状態を保存（戻る機能のため）
    sortHistory.push({
        lstMember: JSON.parse(JSON.stringify(lstMember)), parent: parent.slice(), equal: equal.slice(), rec: rec.slice(),
        cmp1: cmp1, cmp2: cmp2, head1: head1, head2: head2, nrec: nrec, numQuestion: numQuestion, finishSize: finishSize, finishFlag: finishFlag
    });

    var i;
    if (flag<0) { rec[nrec] = lstMember[cmp1][head1]; head1++; nrec++; finishSize++; while (equal[rec[nrec-1]]!=-1) { rec[nrec] = lstMember[cmp1][head1]; head1++; nrec++; finishSize++; } } 
    else if (flag>0) { rec[nrec] = lstMember[cmp2][head2]; head2++; nrec++; finishSize++; while (equal[rec[nrec-1]]!=-1) { rec[nrec] = lstMember[cmp2][head2]; head2++; nrec++; finishSize++; } } 
    else { rec[nrec] = lstMember[cmp1][head1]; head1++; nrec++; finishSize++; while (equal[rec[nrec-1]]!=-1) { rec[nrec] = lstMember[cmp1][head1]; head1++; nrec++; finishSize++; } equal[rec[nrec-1]] = lstMember[cmp2][head2]; rec[nrec] = lstMember[cmp2][head2]; head2++; nrec++; finishSize++; while (equal[rec[nrec-1]]!=-1) { rec[nrec] = lstMember[cmp2][head2]; head2++; nrec++; finishSize++; } }
    
    if (parent[cmp1] == 0 && nrec >= 20) { for (i = 0; i < nrec; i++) lstMember[0][i] = rec[i]; cmp1 = -1; finishSize = totalSize; }
    if (cmp1 >= 0) { if (head1<lstMember[cmp1].length && head2==lstMember[cmp2].length) { while (head1<lstMember[cmp1].length){ rec[nrec] = lstMember[cmp1][head1]; head1++; nrec++; finishSize++; } } else if (head1==lstMember[cmp1].length && head2<lstMember[cmp2].length) { while (head2<lstMember[cmp2].length){ rec[nrec] = lstMember[cmp2][head2]; head2++; nrec++; finishSize++; } } if (head1==lstMember[cmp1].length && head2==lstMember[cmp2].length) { for (i=0; i<lstMember[cmp1].length+lstMember[cmp2].length; i++) lstMember[parent[cmp1]][i] = rec[i]; lstMember.pop(); lstMember.pop(); cmp1 -= 2; cmp2 -= 2; head1 = 0; head2 = 0; if (head1==0 && head2==0) { for (i=0; i<namMember.length; i++) rec[i] = 0; nrec = 0; } } }
    
    if (cmp1<0) { showResult(); finishFlag = 1; } else { showImage(); }
}

// ★一つ戻る機能（本戦用）
function undoSort() {
    if (sortHistory.length === 0) return;
    var state = sortHistory.pop();
    lstMember = state.lstMember; parent = state.parent; equal = state.equal; rec = state.rec;
    cmp1 = state.cmp1; cmp2 = state.cmp2; head1 = state.head1; head2 = state.head2;
    nrec = state.nrec; numQuestion = state.numQuestion; finishSize = state.finishSize; finishFlag = state.finishFlag;
    showImage();
}

function showImage() {
    document.getElementById("battleNumber").innerHTML = "Battle No."+numQuestion+"<br>進行度: "+Math.floor(finishSize*100/totalSize)+"% sorted.";
    document.getElementById("leftField").innerHTML = namMember[lstMember[cmp1][head1]];
    document.getElementById("rightField").innerHTML = namMember[lstMember[cmp2][head2]];
    numQuestion++;
}

function showResult() {
    showStep("step-result");
    var ranking = 1, sameRank = 1, str = "";
    var top10Songs = [];
    
    str += "<table class='result-table'><tr><th style='width:50px;'>順位</th><th>曲名</th></tr>";
    for (var i = 0; i < namMember.length; i++) {
        if (ranking > 20) break;
        var songName = namMember[lstMember[0][i]];
        str += "<tr><td style='text-align:center; font-weight:bold;'>" + ranking + "</td><td>" + songName + "</td></tr>";
        if (top10Songs.length < 10) { top10Songs.push(songName); }
        if (i < namMember.length - 1) { if (equal[lstMember[0][i]] == lstMember[0][i + 1]) sameRank++; else { ranking += sameRank; sameRank = 1; } }
    }
    str += "</table>";
    document.getElementById("resultField").innerHTML = str;

    // ★同意した場合のみ、自動で送信処理を行う
    if(isConsentGiven) {
        while(top10Songs.length < 10) { top10Songs.push("データなし"); }
        var formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSe2ftmvqTI6eGHKEXG3bUnAmYYXrM5O8ctekXqLbmamZB3uhg/formResponse';
        var formData = new FormData();
        formData.append('entry.1121843297', top10Songs[0]); 
        formData.append('entry.580785967', top10Songs[1]);  
        formData.append('entry.592999485', top10Songs[2]);  
        formData.append('entry.1377600566', top10Songs[3]); 
        formData.append('entry.690236532', top10Songs[4]);  
        formData.append('entry.928021331', top10Songs[5]);  
        formData.append('entry.1625239877', top10Songs[6]); 
        formData.append('entry.1671444291', top10Songs[7]); 
        formData.append('entry.298148753', top10Songs[8]);  
        formData.append('entry.1085041009', top10Songs[9]); 
        formData.append('entry.1189851960', selectedOshiName); 

        fetch(formUrl, { method: 'POST', mode: 'no-cors', body: formData }).then(response => { console.log('送信完了'); });
    }
}

    var element = document.getElementById("capture-area");
    html2canvas(element, { scale: 2 }).then(canvas => {
